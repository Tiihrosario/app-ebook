    <style>
      :root {
        --ink: #f6f0df;
        --muted: #9db1a8;
        --green: #071d18;
        --green2: #0b2821;
        --green3: #12362d;
        --gold: #caa45c;
        --gold2: #efd79b;
        --line: rgba(223, 192, 123, 0.18);
        --paper: #f1e8d5;
        --display:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --sans: var(--font-geist-sans), Inter, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: #061712;
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background:
          radial-gradient(
            circle at 84% 5%,
            rgba(190, 145, 64, 0.1),
            transparent 25%
          ),
          radial-gradient(
            circle at 12% 92%,
            rgba(26, 94, 74, 0.18),
            transparent 30%
          ),
          repeating-linear-gradient(
            112deg,
            rgba(255, 255, 255, 0.009) 0 1px,
            transparent 1px 5px
          ),
          #061712;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        opacity: 0.3;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.58' numOctaves='5' seed='8' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
        background-size: 260px 260px;
        mix-blend-mode: soft-light;
      }
      body:after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0.19;
        background: repeating-radial-gradient(
          ellipse at 20% 20%,
          rgba(225, 197, 135, 0.035) 0 1px,
          transparent 1px 4px
        );
        background-size: 9px 7px;
        mix-blend-mode: overlay;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        color: inherit;
      }
      ::selection {
        background: var(--gold);
        color: #10251f;
      }
      .app-shell {
        min-height: 100vh;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 258px;
        padding: 28px 22px 24px;
        background: linear-gradient(
          180deg,
          rgba(11, 40, 33, 0.98),
          rgba(6, 24, 19, 0.99)
        );
        border-right: 1px solid var(--line);
        box-shadow:
          inset -1px 0 rgba(255, 255, 255, 0.025),
          18px 0 55px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        z-index: 40;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand strong,
      .brand span {
        display: block;
      }
      .brand strong {
        font-family: var(--display);
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.01em;
        text-shadow: 0 1px 0 #000;
      }
      .brand span {
        color: var(--muted);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.19em;
        margin-top: 2px;
      }
      .logo-mark {
        position: relative;
        width: 43px;
        height: 43px;
        border: 1px solid rgba(225, 190, 115, 0.38);
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--gold2);
        background:
          radial-gradient(
            circle at 35% 28%,
            rgba(241, 210, 146, 0.2),
            transparent 24%
          ),
          linear-gradient(
            145deg,
            rgba(207, 164, 84, 0.13),
            rgba(3, 20, 15, 0.28)
          );
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.12),
          inset 0 -8px 16px rgba(0, 0, 0, 0.22),
          0 8px 20px rgba(0, 0, 0, 0.2);
        flex: 0 0 auto;
      }
      .logo-mark i {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--gold);
      }
      .logo-mark i:nth-child(2) {
        left: 2px;
        top: 12px;
      }
      .logo-mark i:nth-child(3) {
        right: 4px;
        top: 5px;
      }
      .logo-mark i:nth-child(4) {
        right: 1px;
        bottom: 10px;
      }
      .sidebar-kicker {
        margin: 40px 12px 12px;
        color: #708e81;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }
      .side-nav {
        display: grid;
        gap: 6px;
      }
      .side-nav button {
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 12px;
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 12px;
        color: #8fa99e;
        text-align: left;
        cursor: pointer;
        transition: 0.2s;
      }
      .side-nav button:hover {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.025);
      }
      .side-nav button.active {
        color: var(--gold2);
        border-color: var(--line);
        background: linear-gradient(
          145deg,
          rgba(212, 174, 98, 0.14),
          rgba(3, 21, 16, 0.2)
        );
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.05),
          0 7px 18px rgba(0, 0, 0, 0.13);
      }
      .side-nav button span {
        font-size: 13px;
        font-weight: 520;
      }
      .side-nav button em {
        font-style: normal;
        font-size: 10px;
        color: #759287;
      }
      .side-quote {
        margin-top: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        color: var(--gold);
        background: linear-gradient(
          145deg,
          rgba(210, 168, 89, 0.065),
          rgba(3, 21, 16, 0.18)
        );
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.045),
          0 13px 28px rgba(0, 0, 0, 0.12);
      }
      .side-quote p {
        font-family: var(--display);
        font-size: 15px;
        line-height: 1.5;
        color: #d9ccb0;
        margin: 10px 0 0;
        font-style: italic;
      }
      .side-progress {
        margin-top: 18px;
        padding: 0 4px;
      }
      .side-progress > div:first-child {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .side-progress span {
        font-size: 10px;
        color: #6d897d;
      }
      .side-progress strong {
        font-size: 9px;
        font-weight: 500;
        color: #9eb0a8;
      }
      .mini-track {
        height: 3px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        margin-top: 9px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.55);
      }
      .mini-track i {
        height: 100%;
        display: block;
        background: linear-gradient(90deg, var(--gold), var(--gold2));
        border-radius: 4px;
        box-shadow: 0 0 8px rgba(220, 179, 98, 0.4);
      }
      .main {
        min-height: 100vh;
        margin-left: 258px;
      }
      .topbar {
        height: 74px;
        padding: 0 42px;
        border-bottom: 1px solid rgba(223, 192, 123, 0.1);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        position: sticky;
        top: 0;
        background: rgba(6, 24, 19, 0.78);
        backdrop-filter: blur(18px);
        box-shadow: 0 9px 30px rgba(0, 0, 0, 0.08);
        z-index: 20;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .streak {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #9ab0a6;
        font-size: 11px;
      }
      .streak svg {
        color: var(--gold);
      }
      .avatar {
        width: 35px;
        height: 35px;
        border-radius: 50%;
        border: 1px solid rgba(223, 192, 123, 0.32);
        background: linear-gradient(145deg, #1d4137, #0d2921);
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.08),
          0 6px 16px rgba(0, 0, 0, 0.2);
        color: var(--gold2);
        cursor: pointer;
        font-family: var(--display);
        font-size: 15px;
      }
      .menu-button,
      .mobile-brand,
      .mobile-close,
      .bottom-nav,
      .menu-scrim {
        display: none;
      }
      .page {
        width: min(1180px, calc(100% - 84px));
        margin: 0 auto;
        padding: 50px 0 90px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--gold);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }
      .page-intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin-bottom: 28px;
      }
      .page-intro h1,
      .page-heading h1,
      .library-hero h1,
      .profile-intro h1 {
        font-family: var(--display);
        font-size: 42px;
        line-height: 1.05;
        font-weight: 500;
        margin: 0;
        color: #f5eddc;
      }
      .page-intro > div > p:last-child,
      .page-heading > p:last-child,
      .library-hero > div > p:last-child,
      .profile-intro > p:last-child {
        color: var(--muted);
        font-size: 13px;
        margin: 9px 0 0;
      }
      .date-pill {
        font-size: 10px;
        color: #8aa297;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 13px;
        letter-spacing: 0.05em;
      }
      .hero-card {
        min-height: 330px;
        border: 1px solid rgba(224, 190, 116, 0.22);
        border-radius: 25px;
        background:
          radial-gradient(
            circle at 85% 20%,
            rgba(208, 170, 95, 0.13),
            transparent 31%
          ),
          linear-gradient(135deg, #0e3027, #08221b 58%, #0b281f);
        display: grid;
        grid-template-columns: 190px 1fr 130px;
        align-items: center;
        gap: 38px;
        padding: 30px 40px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.18);
      }
      .hero-card:before {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        border: 1px solid rgba(215, 178, 103, 0.09);
        border-radius: 50%;
        right: -90px;
        top: -110px;
        box-shadow:
          0 0 0 48px rgba(215, 178, 103, 0.025),
          0 0 0 96px rgba(215, 178, 103, 0.018);
      }
      .cover-wrap {
        height: 270px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cover-wrap img {
        height: 100%;
        max-width: 100%;
        object-fit: contain;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 28px 22px rgba(0, 0, 0, 0.45));
        border-radius: 3px;
      }
      .cover-glow {
        position: absolute;
        width: 120px;
        height: 70px;
        bottom: 6px;
        background: rgba(211, 169, 90, 0.25);
        filter: blur(34px);
      }
      .hero-copy {
        position: relative;
        z-index: 2;
      }
      .hero-copy h2 {
        font-family: var(--display);
        font-weight: 400;
        font-size: 31px;
        line-height: 1.13;
        margin: 0 0 12px;
      }
      .hero-copy h2 em {
        color: var(--gold2);
        font-style: normal;
      }
      .hero-copy > p:not(.eyebrow) {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
      }
      .hero-meta {
        display: flex;
        gap: 22px;
        margin: 23px 0 25px;
        color: #9eb4aa;
        font-size: 11px;
      }
      .hero-meta span {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .hero-meta svg {
        color: var(--gold);
      }
      .primary-button {
        border: 0;
        border-radius: 10px;
        padding: 12px 17px;
        background: linear-gradient(135deg, #d3aa60, #edcf91);
        color: #12271f;
        font-size: 11px;
        font-weight: 720;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(192, 149, 70, 0.12);
        transition: 0.2s;
      }
      .primary-button:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }
      .hero-progress {
        position: relative;
        z-index: 2;
        text-align: center;
      }
      .hero-progress > span {
        display: block;
        color: #728f83;
        font-size: 9px;
        line-height: 1.45;
        margin-top: 10px;
      }
      .progress-ring {
        --progress: 0deg;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: conic-gradient(
          var(--gold) var(--progress),
          rgba(255, 255, 255, 0.055) 0
        );
        position: relative;
        margin: auto;
      }
      .progress-ring:before {
        content: "";
        position: absolute;
        inset: 5px;
        background: #0b271f;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.025);
      }
      .progress-ring span {
        position: relative;
        font-family: var(--display);
        font-size: 20px;
        color: var(--gold2);
      }
      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: end;
        margin: 42px 0 17px;
      }
      .section-title h2 {
        font-family: var(--display);
        font-size: 27px;
        font-weight: 500;
        margin: 0;
      }
      .section-title > button {
        border: 0;
        background: transparent;
        color: #9cafaa;
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
      }
      .phase-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .phase-card {
        min-height: 126px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: rgba(15, 48, 39, 0.65);
        padding: 18px;
        display: grid;
        grid-template-columns: 41px 1fr auto;
        gap: 13px;
        align-items: start;
        text-align: left;
        cursor: pointer;
        transition: 0.2s;
      }
      .phase-card:hover {
        border-color: rgba(223, 192, 123, 0.35);
        transform: translateY(-2px);
      }
      .phase-card.current {
        background: linear-gradient(
          145deg,
          rgba(199, 160, 86, 0.15),
          rgba(15, 48, 39, 0.85)
        );
        border-color: rgba(223, 192, 123, 0.34);
      }
      .phase-letter {
        width: 41px;
        height: 41px;
        border-radius: 10px;
        border: 1px solid rgba(223, 192, 123, 0.3);
        display: grid;
        place-items: center;
        font-family: var(--display);
        font-size: 21px;
        color: var(--gold2);
      }
      .phase-card h3 {
        font-family: var(--display);
        font-size: 17px;
        font-weight: 500;
        margin: 2px 0;
      }
      .phase-card p {
        font-size: 9px;
        color: #88a095;
        margin: 0 0 17px;
      }
      .phase-card small {
        font-size: 8px;
        color: #5f7e70;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .phase-card > svg {
        color: #6b897b;
        margin-top: 11px;
      }
      .phase-check {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--gold);
        color: #11271f;
        display: grid;
        place-items: center;
        margin-top: 8px;
      }
      .tool-grid {
        display: grid;
        grid-template-columns: 1.35fr 1fr 1fr;
        gap: 12px;
      }
      .tool-card {
        border: 1px solid var(--line);
        border-radius: 15px;
        background: rgba(15, 47, 39, 0.58);
        padding: 20px;
        display: grid;
        grid-template-columns: 43px 1fr auto;
        gap: 14px;
        text-align: left;
        cursor: pointer;
        min-height: 160px;
        transition: 0.2s;
      }
      .tool-card:hover {
        border-color: rgba(223, 192, 123, 0.35);
        transform: translateY(-2px);
      }
      .tool-card.featured {
        background:
          radial-gradient(
            circle at 0 100%,
            rgba(197, 154, 77, 0.12),
            transparent 35%
          ),
          #0d3027;
      }
      .tool-icon {
        width: 43px;
        height: 43px;
        border-radius: 12px;
        border: 1px solid rgba(223, 192, 123, 0.26);
        display: grid;
        place-items: center;
        color: var(--gold);
        background: rgba(205, 164, 84, 0.055);
      }
      .tool-icon.large {
        width: 58px;
        height: 58px;
        border-radius: 16px;
      }
      .tool-card small {
        color: #638175;
        font-size: 8px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .tool-card h3 {
        font-family: var(--display);
        font-size: 18px;
        font-weight: 500;
        margin: 5px 0 7px;
      }
      .tool-card p {
        font-size: 10px;
        line-height: 1.5;
        color: #829c90;
        margin: 0;
      }
      .tool-card > svg {
        color: #69877a;
        margin-top: 12px;
      }
      .tool-link {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--gold2);
        font-size: 9px;
        margin-top: 16px;
      }
      .library-hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--line);
      }
      .intro-chapter {
        width: 100%;
        margin: 24px 0 34px;
        padding: 20px;
        border: 1px solid rgba(223, 192, 123, 0.25);
        border-radius: 15px;
        background: linear-gradient(
          90deg,
          rgba(197, 154, 77, 0.11),
          rgba(15, 47, 39, 0.58)
        );
        display: grid;
        grid-template-columns: 44px 1fr auto;
        align-items: center;
        gap: 15px;
        text-align: left;
        cursor: pointer;
      }
      .intro-chapter > span {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--gold);
        background: rgba(198, 158, 80, 0.1);
      }
      .intro-chapter small {
        font-size: 8px;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.11em;
      }
      .intro-chapter h3 {
        font-family: var(--display);
        font-size: 18px;
        font-weight: 500;
        margin: 3px 0;
      }
      .intro-chapter p {
        font-size: 10px;
        color: #7f9a8e;
        margin: 0;
      }
      .intro-chapter > svg {
        color: #6f8c7f;
      }
      .chapter-phases {
        display: grid;
        gap: 35px;
      }
      .chapter-group {

      .breath-card {

      /* Login and access */
      .login-page {

      }

        width: min(960px, 100%);

        background: linear-gradient(145deg, #10382e, #061d17);
        box-shadow:
          inset 0 1px rgba(255, 255, 255, 0.07),

          rgba(3, 22, 17, 0.25);

        left: 31px;
        font-family: var(--display);
        color: var(--gold2);

        height: 460px;

      }
      .login-form-wrap {

      .login-form-wrap form {
        display: grid;
        gap: 16px;
      }

        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #91a69c;
      }

        display: block;

        margin-top: 7px;
        border: 1px solid rgba(223, 192, 123, 0.22);

          145deg,
          rgba(2, 17, 13, 0.72),
          rgba(12, 40, 32, 0.54)

      /* Motivation slider */
      .quote-slider {
        min-height: 150px;

      }

        animation: quoteFade 0.45s ease;

      /* Premium login texture, install flow, admin and accessibility */

          radial-gradient(

            rgba(229, 177, 74, 0.19) 0 1px,
            transparent 2px
          ),
          radial-gradient(
            circle at 78% 72%,
            rgba(229, 177, 74, 0.12) 0 1px,
            transparent 2px
          ),
          repeating-linear-gradient(
            118deg,
            rgba(255, 255, 255, 0.035) 0 1px,
            transparent 1px 8px
          ),
          linear-gradient(145deg, rgba(14, 65, 50, 0.96), rgba(2, 19, 14, 0.99));

        inset: 0;

        background:
          linear-gradient(

            transparent 49.6%,
            rgba(229, 177, 74, 0.15) 50%,

          ),
          linear-gradient(
            0deg,
            transparent 49.6%,
            rgba(229, 177, 74, 0.09) 50%,

        mask-image: linear-gradient(to bottom, black, transparent 88%);

      .admin-link {

      .plan30-panel .progress-ring {

      }

        font-family: var(--display);
        font-size: 19px;
        font-weight: 500;
      }
      .plan30-week-title small {
        color: #718d81;
        font-size: 9px;
      }

      }

      .plan30-days button small,

      }

        font-family: var(--display);
        font-size: 14px;
        font-weight: 500;
